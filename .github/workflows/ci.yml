name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies — nothing to install. Auto-discovers test/*.test.mjs;
      # the live suite self-skips without UNIRATE_API_KEY.
      - run: node --test

  lint-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # web-ext is a dev-only tool fetched here on an ephemeral runner; it is
      # never part of the shipped extension (which has zero dependencies).
      - run: npx --yes web-ext@8.3.0 lint --source-dir .
